grocery_analytics:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('GROCERY_DB_HOST', 'localhost') }}"
      port: "{{ env_var('GROCERY_DB_PORT', '5432') | int }}"
      user: "{{ env_var('GROCERY_DB_USER', 'analytics_user') }}"
      pass: "{{ env_var('GROCERY_DB_PASSWORD', 'analytics_pass') }}"
      dbname: "{{ env_var('GROCERY_DB_NAME', 'grocery_analytics') }}"
      schema: analytics
      threads: 4
