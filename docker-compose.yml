services:
  postgres:
    image: postgres:15
    container_name: grocery_postgres
    environment:
      POSTGRES_USER: ${GROCERY_DB_USER:-analytics_user}
      POSTGRES_PASSWORD: ${GROCERY_DB_PASSWORD:?Set GROCERY_DB_PASSWORD in .env}
      POSTGRES_DB: ${GROCERY_DB_NAME:-grocery_analytics}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  metabase:
    image: metabase/metabase:v0.58.7.1
    container_name: grocery_metabase
    ports:
      - "3000:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - metabase_data:/metabase-data
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
  metabase_data: